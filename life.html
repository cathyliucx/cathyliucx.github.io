    <script type="module">
      import { feature } from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';
      import { geoIdentity, geoNaturalEarth1, geoPath } from 'https://cdn.jsdelivr.net/npm/d3-geo@3/+esm';

      const svg = 'http://www.w3.org/2000/svg';
      const removePolarOutliers = (country) => {
        if (country.geometry.type !== 'MultiPolygon') return country;
        const coordinates = country.geometry.coordinates.filter((polygon) => {
          const latitudes = polygon.flat(2).filter((_, index) => index % 2 === 1);
          return Math.max(...latitudes) > -45 && Math.min(...latitudes) < 75;
        });
        return { ...country, geometry: { ...country.geometry, coordinates } };
      };
      const removeSouthChinaSeaOutliers = (province) => {
        if (province.geometry.type !== 'MultiPolygon') return province;
        const coordinates = province.geometry.coordinates.filter((polygon) => {
          const latitudes = polygon.flat(2).filter((_, index) => index % 2 === 1);
          return Math.max(...latitudes) >= 17;
        });
        return { ...province, geometry: { ...province.geometry, coordinates } };
      };
      // Add future travel stops here. `scope` is either `map` (world) or `china`.
      const visitedPlaces = [
        { scope: 'map', name: 'London', longitude: -0.13, latitude: 51.51, dx: 10, dy: 17 },
        { scope: 'map', name: 'York', longitude: -1.08, latitude: 53.96, dx: -28, dy: -17 },
        { scope: 'map', name: 'Paris', longitude: 2.35, latitude: 48.86, markerDx: 18, markerDy: 15, dx: 8, dy: 18 },
        { scope: 'map', name: 'Helsinki', longitude: 24.94, latitude: 60.17, dx: 10, dy: -10 },
        { scope: 'china', name: 'Xi\'an', longitude: 108.94, latitude: 34.34, dx: -34, dy: -10 },
        { scope: 'china', name: 'Lhasa', longitude: 91.11, latitude: 29.65, dx: -31, dy: -10 },
        { scope: 'china', name: 'Beijing', longitude: 116.41, latitude: 39.9, dx: 10, dy: -10 },
        { scope: 'china', name: 'Shanghai', longitude: 121.47, latitude: 31.23, dx: 12, dy: -23 },
        { scope: 'china', name: 'Chengdu', longitude: 104.07, latitude: 30.67, dx: -47, dy: -10 },
        { scope: 'china', name: 'Guangzhou', longitude: 113.26, latitude: 23.13, dx: -57, dy: -18 },
        { scope: 'china', name: 'Shenzhen', longitude: 114.06, latitude: 22.55, dx: 10, dy: 20 },
        { scope: 'china', name: 'Hong Kong', longitude: 114.17, latitude: 22.32, markerDx: -18, markerDy: 20, dx: -48, dy: 23 },
        { scope: 'china', name: 'Hangzhou', longitude: 120.16, latitude: 30.27, dx: 19, dy: 20 },
        { scope: 'china', name: 'Ningbo', longitude: 121.55, latitude: 29.87, markerDx: -14, markerDy: 18, dx: -45, dy: 22 }
      ];
      const addVisitedPlaces = (layer, projection, scope) => {
        for (const place of visitedPlaces.filter((item) => item.scope === scope)) {
          const point = projection([place.longitude, place.latitude]);
          if (!point) continue;
          const marker = document.createElementNS(svg, 'g');
          marker.setAttribute('class', 'visited-place');
          const markerX = point[0] + (place.markerDx || 0);
          const markerY = point[1] + (place.markerDy || 0);

          const halo = document.createElementNS(svg, 'circle');
          halo.setAttribute('class', 'visited-place-halo');
          halo.setAttribute('cx', markerX);
          halo.setAttribute('cy', markerY);
          halo.setAttribute('r', '8');
          marker.append(halo);

          const core = document.createElementNS(svg, 'circle');
          core.setAttribute('class', 'visited-place-core');
          core.setAttribute('cx', markerX);
          core.setAttribute('cy', markerY);
          core.setAttribute('r', '3.5');
          marker.append(core);

          const label = document.createElementNS(svg, 'text');
          label.setAttribute('class', 'visited-place-label');
          label.setAttribute('x', markerX + (place.dx || 9));
          label.setAttribute('y', markerY + (place.dy || -9));
          label.textContent = place.name;
          marker.append(label);
          layer.append(marker);
        }
      };

      const map = document.querySelector('.world-map');
      const countriesLayer = map?.querySelector('.map-countries');

      if (map && countriesLayer) {
        try {
          const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
          if (!response.ok) throw new Error('World map data could not be loaded.');
          const topology = await response.json();
          const countries = feature(topology, topology.objects.countries);
          const visibleCountries = {
            type: 'FeatureCollection',
            features: countries.features
              .filter((country) => !['010', '260'].includes(String(country.id).padStart(3, '0')))
              .map(removePolarOutliers)
              .filter((country) => country.geometry.coordinates.length)
          };
          const projection = geoNaturalEarth1().fitSize([1200, 500], visibleCountries);
          const path = geoPath(projection);

          for (const geometry of visibleCountries.features) {
            const country = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            country.setAttribute('class', 'map-country');
            country.setAttribute('d', path(geometry) || '');
            countriesLayer.append(country);
          }
          addVisitedPlaces(countriesLayer, projection, 'map');
          map.classList.add('is-detailed');
        } catch {
          map.classList.add('uses-fallback');
        }
      }

      const chinaMap = document.querySelector('.china-map');
      const provincesLayer = chinaMap?.querySelector('.china-provinces');

      if (chinaMap && provincesLayer) {
        try {
          const response = await fetch('https://cdn.jsdelivr.net/gh/Supeset/China-GeoData@5822c4c0a0bdfd73327f9454976c8661bfd6ad9f/geojson/china_province_full.geojson');
          if (!response.ok) throw new Error('China map data could not be loaded.');
          const china = await response.json();
          const provinces = {
            type: 'FeatureCollection',
            // The source's unnamed South China Sea inset distorts the main map bounds.
            features: china.features
              .filter((province) => province.properties?.name)
              .map(removeSouthChinaSeaOutliers)
              .filter((province) => province.geometry.coordinates.length)
          };
          const projection = geoIdentity().reflectY(true).fitSize([960, 720], provinces);
          const path = geoPath(projection);

          for (const province of provinces.features) {
            const shape = document.createElementNS(svg, 'path');
            shape.setAttribute('class', 'china-province');
            shape.setAttribute('d', path(province) || '');
            provincesLayer.append(shape);
          }
          addVisitedPlaces(provincesLayer, projection, 'china');
          chinaMap.classList.add('is-detailed');
        } catch {
          chinaMap.classList.add('uses-fallback');
        }
      }
    </script>
